# SwiftLint for the package and its demo (make lint). No parent_config: swiftlint/hosts.yml is for hosts, and this
# package is the one place that may use URLSession and Network.framework. swiftlint/probe/ breaks those rules on purpose.
included:
  - Sources
  - Tests
  - Demo
  - Package.swift

excluded:
  - .build
  - Demo/build
  - swiftlint/probe
  - Tests/DurableNetworkingTests/SatmuxVectors.swift # generated by Tools/satmux/vectors.py

# Limits set when SwiftLint first ran here (2026-11-16), so the code as it was passes: the wire and crypto code
# (Satmux/, BLAKE2b) keeps the names and shapes of its specs (a, b, h, G with six arguments, 3-tuples).
line_length:
  warning: 140
  error: 160
  ignores_comments: true
identifier_name:
  min_length: 1
file_length:
  warning: 500
type_body_length:
  warning: 300
large_tuple:
  warning: 3
function_parameter_count:
  warning: 6

trailing_comma:
  mandatory_comma: true

nesting:
  type_level: 2

disabled_rules:
  - todo
  # String(decoding:as:) is meant here: wire text is read leniently, never dropped.
  - optional_data_string_conversion
