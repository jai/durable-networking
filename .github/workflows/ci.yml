name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # GitHub's own Mac runner: free for a public repo.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The release tags, for the API check.
      - run: swift test
      # Never breaking (AGENTS.md): apps take every release, so nothing public may change or go since the latest
      # release. A failure here also holds the release, which waits for ci to pass.
      - name: No public API break since the latest release
        run: |
          base=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          echo "Baseline: $base"
          swift package diagnose-api-breaking-changes "$base"
  demo:
    # The demo app builds from a fresh clone, for iPhone and Mac, against the package by local path. Then end to end:
    # DurableNetworkingDemoUITests drives it on an iPhone simulator and then as the Mac app through every network
    # condition, against the demo server started here (Demo/server/demo_server.py), and checks what reached the server.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen --spec Demo/project.yml
      - run: >-
          xcodebuild build -project Demo/DurableNetworkingDemo.xcodeproj -scheme DurableNetworkingDemo
          -destination 'generic/platform=iOS Simulator' -destination 'generic/platform=macOS'
      - name: Start the demo server
        run: |
          python3 -I Demo/server/demo_server.py --port 8787 > demo-server.log 2>&1 &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8787/writes && exit 0; sleep 1; done
          cat demo-server.log; exit 1
      # Airplane Wi-Fi: satmux's relay with the demo's key (a demo value, AirplaneModel.Setup), and a 600 ms round
      # trip in front of the app's direct requests (SOCKS on 1081) and of its carriers to the relay (8445).
      - name: Start the satmux relay and the satellite link
        run: |
          SATMUX_PSK=$(printf '5a%.0s' $(seq 32)) python3 -I -u Tools/satmux/satmux.py server --host 127.0.0.1 \
            --port 8444 > relay.log 2>&1 &
          python3 -I -u Demo/server/geo_link.py --rtt-ms 600 --socks 1081 --forward 8445:127.0.0.1:8444 \
            > geo-link.log 2>&1 &
          for _ in $(seq 30); do
            grep -q Listening relay.log && grep -q 8445 geo-link.log && exit 0; sleep 1
          done
          cat relay.log geo-link.log; exit 1
      - name: Pick an iPhone simulator
        run: |
          id=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS-2[6-9]")) | .value[] | select(.name | startswith("iPhone"))]
            | last | .udid // empty')
          [ -n "$id" ] || { xcrun simctl list devices available; echo "::error::no iOS 26+ iPhone simulator"; exit 1; }
          echo "SIMULATOR=$id" >> "$GITHUB_ENV"
          xcrun simctl boot "$id"
      - run: mkdir -p tmp/demo-screens
      - name: End-to-end UI test
        env:
          TEST_RUNNER_DEMO_SCREENSHOTS: ${{ github.workspace }}/tmp/demo-screens
        run: >-
          xcodebuild test -project Demo/DurableNetworkingDemo.xcodeproj -scheme DurableNetworkingDemo
          -destination "platform=iOS Simulator,id=$SIMULATOR" -resultBundlePath e2e.xcresult
      # The same UI test on the Mac app, against the same servers. On the Mac a text's string is its element's value,
      # not its label; the test reads either.
      - run: mkdir -p tmp/demo-screens/mac
      - name: End-to-end UI test on the Mac
        env:
          TEST_RUNNER_DEMO_SCREENSHOTS: ${{ github.workspace }}/tmp/demo-screens/mac
        run: >-
          xcodebuild test -project Demo/DurableNetworkingDemo.xcodeproj -scheme DurableNetworkingDemo
          -destination 'platform=macOS' -resultBundlePath e2e-mac.xcresult
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-xcresult
          path: |
            e2e.xcresult
            e2e-mac.xcresult
            demo-server.log
            relay.log
            geo-link.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-screens
          path: tmp/demo-screens
          if-no-files-found: ignore
  lint-rules:
    # swiftlint/hosts.yml as hosts get it: by parent_config from GitHub at this commit. The probe's four uses must be
    # flagged, and its comment, string, transports, delegate method and disable:next must not.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: command -v swiftlint || brew install swiftlint
      - name: Remote parent_config flags exactly the probe's four uses
        run: |
          cd swiftlint/probe
          printf 'parent_config: https://raw.githubusercontent.com/%s/%s/swiftlint/hosts.yml\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" > .swiftlint.yml
          swiftlint lint --quiet --config .swiftlint.yml Probe.swift > lint.txt || true
          cat lint.txt
          found=$(grep -oE '\((no_direct_networking|no_network_framework_import)\)' lint.txt | wc -l | tr -d ' ')
          echo "flagged $found"
          [ "$found" = 4 ] || { echo "::error::expected 4 networking violations, got $found"; exit 1; }
