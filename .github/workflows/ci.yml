name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # GitHub's own Mac runner: free for a public repo.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  demo:
    # The demo app builds from a fresh clone, for iPhone and Mac, against the package by local path. Then end to end:
    # DurableNetworkingDemoUITests drives it on an iPhone simulator through every network condition, against the demo
    # server started here (Demo/server/demo_server.py), and checks what reached the server.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen --spec Demo/project.yml
      - run: >-
          xcodebuild build -project Demo/DurableNetworkingDemo.xcodeproj -scheme DurableNetworkingDemo
          -destination 'generic/platform=iOS Simulator' -destination 'generic/platform=macOS'
      - name: Start the demo server
        run: |
          python3 -I Demo/server/demo_server.py --port 8787 > demo-server.log 2>&1 &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8787/writes && exit 0; sleep 1; done
          cat demo-server.log; exit 1
      - name: Pick an iPhone simulator
        run: |
          id=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS-2[6-9]")) | .value[] | select(.name | startswith("iPhone"))]
            | last | .udid // empty')
          [ -n "$id" ] || { xcrun simctl list devices available; echo "::error::no iOS 26+ iPhone simulator"; exit 1; }
          echo "SIMULATOR=$id" >> "$GITHUB_ENV"
          xcrun simctl boot "$id"
      - run: mkdir -p tmp/demo-screens
      - name: End-to-end UI test
        env:
          TEST_RUNNER_DEMO_SCREENSHOTS: ${{ github.workspace }}/tmp/demo-screens
        run: >-
          xcodebuild test -project Demo/DurableNetworkingDemo.xcodeproj -scheme DurableNetworkingDemo
          -destination "platform=iOS Simulator,id=$SIMULATOR" -resultBundlePath e2e.xcresult
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-xcresult
          path: |
            e2e.xcresult
            demo-server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-screens
          path: tmp/demo-screens
          if-no-files-found: ignore
  lint-rules:
    # swiftlint/hosts.yml as hosts get it: by parent_config from GitHub at this commit. The probe's four uses must be
    # flagged, and its comment, string, transports, delegate method and disable:next must not.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: command -v swiftlint || brew install swiftlint
      - name: Remote parent_config flags exactly the probe's four uses
        run: |
          cd swiftlint/probe
          printf 'parent_config: https://raw.githubusercontent.com/%s/%s/swiftlint/hosts.yml\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" > .swiftlint.yml
          swiftlint lint --quiet --config .swiftlint.yml Probe.swift > lint.txt || true
          cat lint.txt
          found=$(grep -oE '\((no_direct_networking|no_network_framework_import)\)' lint.txt | wc -l | tr -d ' ')
          echo "flagged $found"
          [ "$found" = 4 ] || { echo "::error::expected 4 networking violations, got $found"; exit 1; }
