name: test-integration-sdk
on:
  push:
    branches: [main]
    paths: ["Sources/**", "Tests/**", "Demo/**", "Package.swift", "Package.resolved", "Makefile", ".swiftlint.yml", ".swiftformat", "mise.toml", "cliff.toml", ".github/workflows/**", "Tools/**", "swiftlint/**", "ruff.toml", "requirements-test.txt", "pytest.ini"]
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, zoomies, mac]
    timeout-minutes: 20
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - name: Prepare Python test environment
        run: |
          mise exec uv@0.13.8 -- uv venv --python 3.14 .venv
          mise exec uv@0.13.8 -- uv pip install --python .venv/bin/python -r requirements-test.txt
      - name: Run test-integration checks
        run: make test-integration-sdk
      - name: Remove disposable products
        if: always()
        run: rm -rf -- .build .venv Demo/build Demo/*.xcodeproj server/node_modules server/dist
