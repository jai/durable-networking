name: release
# Hourly (jai/ci's release-clock Worker) and by hand, at most once an hour: tags and publishes main's newest CI-green commit when it holds unreleased
# feat or fix commits. Agent Pager, PRHub and the kits pin these tags. .github/scripts/release.sh picks the version.
on:
  workflow_dispatch:
concurrency: release
permissions:
  contents: write
  actions: read
jobs:
  release:
    # GitHub's own runner: free for a public repo.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The jai-agents GitHub App token can create a tag over commits that change
      # .github/workflows; github.token cannot (no workflows permission).
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: 5757830
          private-key: ${{ secrets.JAI_AGENTS_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: .github/scripts/release.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
