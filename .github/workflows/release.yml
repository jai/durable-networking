name: release
on:
  push:
    tags: [rc-sdk-v*]
permissions:
  contents: read
concurrency:
  group: release-sdk
  cancel-in-progress: false
jobs:
  lint:
    uses: ./.github/workflows/lint-sdk.yml
  unit:
    uses: ./.github/workflows/test-unit-sdk.yml
  integration:
    needs: unit
    uses: ./.github/workflows/test-integration-sdk.yml
  ui:
    needs: [lint, unit, integration]
    uses: ./.github/workflows/test-ui-sdk.yml
  publish:
    needs: [lint, unit, integration, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: 5757830
          private-key: ${{ secrets.JAI_AGENTS_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Publish the tested candidate
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          version=${GITHUB_REF_NAME#rc-sdk-v}
          version=${version%-*}
          tag="v$version"
          npx --yes git-cliff@2.14.2 --unreleased --tag "$tag" --strip all > "$RUNNER_TEMP/notes.md"
          git -c user.name='jai-agents[bot]' -c user.email='356602356+jai-agents[bot]@users.noreply.github.com' tag -a "$tag" -F "$RUNNER_TEMP/notes.md"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
