default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: fix-and-lint-sdk
        name: Fix and stage changed SDK files, then lint the SDK
        entry: bash -ec 'make fix FILES="$*"; git add -- "$@"; exec make lint-sdk' --
        language: system
        stages: [pre-commit]
        files: '^(Sources|Tests|Demo|Tools|swiftlint|\.claude)/|^(Package\.|Makefile$|mise\.toml$|requirements-test\.txt$|pytest\.ini$|ruff\.toml$|\.swiftlint\.yml$|\.swiftformat$|\.pre-commit-config\.yaml$)'
      - id: lint-workflows
        name: Lint changed workflows
        entry: make lint-workflows
        language: system
        pass_filenames: false
        files: '^\.github/workflows/'
        stages: [pre-commit]
      - id: test-unit-sdk
        name: Run SDK unit tests before pushing
        entry: bash -c 'unset $(git rev-parse --local-env-vars); exec make test-unit-sdk'
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: '^(Sources|Tests|Demo|Tools)/|^(Package\.|Makefile$|mise\.toml$|requirements-test\.txt$|pytest\.ini$|ruff\.toml$)'
