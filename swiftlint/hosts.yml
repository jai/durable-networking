# DurableNetworking's lint rules for the apps and kits that use it. A host's .swiftlint.yml pulls them in by tag:
#
#   parent_config: https://raw.githubusercontent.com/jai/durable-networking/v0.2.0/swiftlint/hosts.yml
#
# Every request goes through DurableNetworking's HTTPTransport or StreamingTransport, so nothing sent skips the outbox
# and nothing seen skips the cache. match_kinds keeps comments and strings out. An exception is
# `// swiftlint:disable:next no_direct_networking` with its reason on the line above.
custom_rules:
  no_direct_networking:
    name: "No direct networking"
    # URLSession and its types (DurableNetworking's own URLSessionTransport and URLSessionStreamingTransport are how a
    # host makes a transport, so they are allowed), Network.framework's connections and monitors, CFNetwork's streams
    # and messages, NSURLConnection. A URLRequest is allowed: it is a value, and only a transport can send it.
    regex: '\b(URLSession(?!(Streaming)?Transport\b)\w*|NSURLConnection|NW(Connection|PathMonitor|Listener|Browser|Endpoint|Parameters|ProtocolFramer)\w*|CF(Read|Write)Stream\w*|CFHTTPMessage\w*|CFStreamCreatePairWith\w*)\b'
    match_kinds: [identifier, typeidentifier]
    message: >-
      Networking outside DurableNetworking: send requests through an HTTPTransport or StreamingTransport the host
      passes in (https://github.com/jai/durable-networking#one-way-out).
    severity: error
  no_network_framework_import:
    name: "No Network framework import"
    regex: '^\s*(@\w+\s+)*import\s+(Network|CFNetwork)\b'
    match_kinds: [keyword, identifier]
    message: >-
      Network.framework belongs to DurableNetworking: use NetworkStatus or PathWatcher
      (https://github.com/jai/durable-networking#one-way-out).
    severity: error
